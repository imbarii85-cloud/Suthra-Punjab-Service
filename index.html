<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Department Portal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --green: #0b7a45;
      --green-2: #14a75f;
      --green-soft: #e2f1e8;
      --bg: #e9f2ec;
      --ink: #15231b;
      --muted: #69796f;
      --line: #d7e6dc;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      position: relative;
      overflow-x: hidden;
    }

    /* soft blurred colour blobs behind the glass */
    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
    }

    body::before {
      width: 520px;
      height: 520px;
      top: -140px;
      right: -120px;
      background: radial-gradient(circle, #9fdcb8 0%, transparent 70%);
      opacity: .75;
    }

    body::after {
      width: 480px;
      height: 480px;
      bottom: -160px;
      left: -120px;
      background: radial-gradient(circle, #bfe6cf 0%, transparent 70%);
      opacity: .8;
    }

    /* ---------- Entrance for sidebar + header ---------- */
    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(34px) scale(.965);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .enter {
      opacity: 0;
      animation: riseIn .8s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--d, 0) * 1ms);
    }

    /* ---------- Profile card ---------- */
    .profile-card {
      background: #fff;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow:
        0 1px 1px rgba(16, 40, 26, .05),
        0 6px 12px rgba(16, 40, 26, .06),
        0 18px 32px rgba(16, 40, 26, .08),
        0 40px 70px -10px rgba(11, 122, 69, .18),
        inset 0 1px 0 #fff;
    }

    .logo-box {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #1cbf72, #0a6d3d);
      color: #fff;
      font-size: 30px;
      box-shadow:
        0 10px 20px rgba(11, 122, 69, .35),
        inset 0 2px 0 rgba(255, 255, 255, .35),
        inset 0 -6px 10px rgba(0, 0, 0, .15);
    }

    .avatar-ring {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      padding: 5px;
      background: conic-gradient(from 210deg, #14a75f, #a8e6c3, #14a75f);
      box-shadow: 0 14px 26px rgba(11, 122, 69, .28);
      position: relative;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f2faf5, #d6ecdf);
      color: var(--green);
      font-size: 44px;
      border: 4px solid #fff;
      box-shadow: inset 0 4px 10px rgba(11, 122, 69, .15);
    }

    .avatar-dot {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #22c55e;
      border: 3px solid #fff;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, .6);
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, .55);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 16px;
      background: linear-gradient(180deg, #fbfdfc, #f3f8f5);
      border: 1px solid var(--line);
      box-shadow: 0 2px 4px rgba(16, 40, 26, .04), inset 0 1px 0 #fff;
      text-align: left;
    }

    .info-ico {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--green-soft);
      color: var(--green);
      font-size: 14px;
      box-shadow: inset 0 -2px 4px rgba(11, 122, 69, .12);
    }

    .info-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.2;
    }

    .info-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
      word-break: break-word;
    }

    /* ---------- Header bar (glass) ---------- */
    .header-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .55);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      backdrop-filter: blur(14px) saturate(140%);
      border: 1.5px solid rgba(11, 122, 69, .35);
      border-left: 6px solid var(--green);
      box-shadow:
        0 4px 10px rgba(16, 40, 26, .05),
        0 16px 30px rgba(16, 40, 26, .07),
        inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .header-ico {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #1cbf72, #0a6d3d);
      color: #fff;
      font-size: 18px;
      box-shadow: 0 8px 16px rgba(11, 122, 69, .3), inset 0 2px 0 rgba(255, 255, 255, .3);
    }

    /* ---------- App grid ---------- */
    .app-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      perspective: 1200px;
    }

    @media (min-width:480px) {
      .app-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    @media (min-width:1100px) {
      .app-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
      }
    }

    .cell {
      opacity: 0;
      animation: riseIn .75s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(450ms + var(--i) * 130ms);
    }

    /* ---------- 3D card ---------- */
    .card {
      --rx: 0deg;
      --ry: 0deg;
      --lift: 0px;
      --s: 1;
      --accent: var(--green);
      --accent-soft: var(--green-soft);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-height: 190px;
      padding: 28px 16px;
      border-radius: 22px;
      text-decoration: none;
      color: var(--ink);
      background: linear-gradient(160deg, #ffffff 0%, #f5f8f6 100%);
      border: 1.5px solid rgba(255, 255, 255, .95);
      box-shadow:
        0 1px 1px rgba(16, 40, 26, .05),
        0 3px 6px rgba(16, 40, 26, .05),
        0 10px 18px rgba(16, 40, 26, .06),
        0 22px 34px rgba(16, 40, 26, .07),
        inset 0 1px 0 #fff;
      transform: perspective(900px) translateY(var(--lift)) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));
      transform-style: preserve-3d;
      transition: transform .28s cubic-bezier(.2, .8, .2, 1), box-shadow .28s ease, border-color .28s ease;
      overflow: hidden;
      outline: none;
      cursor: pointer;
      user-select: none;
    }

    .card:hover {
      --lift: -12px;
      border-color: var(--green-2);
      box-shadow:
        0 0 0 2px rgba(20, 167, 95, .55),
        0 0 26px 2px rgba(20, 167, 95, .40),
        0 18px 26px rgba(16, 40, 26, .10),
        0 36px 60px rgba(11, 122, 69, .20),
        inset 0 1px 0 #fff;
    }

    .card:focus-visible {
      --lift: -8px;
      border-color: var(--green-2);
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--green-2), 0 24px 40px rgba(11, 122, 69, .25);
    }

    .card:active {
      --lift: -2px;
      --s: .94;
      transition-duration: .09s;
      box-shadow:
        0 0 0 2px rgba(20, 167, 95, .7),
        0 4px 8px rgba(16, 40, 26, .10),
        inset 0 4px 10px rgba(16, 40, 26, .08);
    }

    .icon-wrap {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 25%, #fff 0%, var(--accent-soft) 60%);
      color: var(--accent);
      font-size: 32px;
      box-shadow:
        0 10px 18px rgba(16, 40, 26, .10),
        inset 0 -6px 10px rgba(16, 40, 26, .06),
        inset 0 2px 0 #fff;
      transform: translateZ(30px);
      transition: transform .28s cubic-bezier(.2, .8, .2, 1);
    }

    .card:hover .icon-wrap {
      transform: translateZ(46px) scale(1.06);
    }

    .card-title {
      font-weight: 800;
      font-size: 15px;
      line-height: 1.3;
      text-align: center;
      transform: translateZ(18px);
    }

    @keyframes bounce {
      0% {
        transform: translateZ(40px) scale(1);
      }

      35% {
        transform: translateZ(60px) scale(1.22);
      }

      65% {
        transform: translateZ(40px) scale(.92);
      }

      100% {
        transform: translateZ(40px) scale(1);
      }
    }

    .icon-wrap.bounce {
      animation: bounce .45s cubic-bezier(.3, 1.6, .5, 1);
    }

    /* ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 167, 95, .35) 0%, rgba(20, 167, 95, .18) 55%, transparent 70%);
      transform: scale(0);
      animation: ripple .65s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(1);
        opacity: 0;
      }
    }

    /* footer note */
    .foot {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    /* ---------- Accessibility ---------- */
    @media (prefers-reduced-motion:reduce) {

      .enter,
      .cell {
        animation: none;
        opacity: 1;
      }

      .avatar-dot {
        animation: none;
      }

      .card,
      .icon-wrap {
        transition: none;
      }

      .icon-wrap.bounce,
      .ripple {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="mx-auto flex min-h-screen w-full max-w-[1180px] items-center px-4 py-8 sm:px-6 lg:px-8">
    <div class="w-full">

      <!-- ================= MAIN CONTENT ================= -->
      <main class="min-w-0">

        <!-- Header bar -->
        <header class="header-bar enter" style="--d:150">
          <span class="header-ico"><i class="fa-solid fa-building-columns"></i></span>
          <h1 id="deptName" class="text-base sm:text-lg font-extrabold leading-snug">Department Name</h1>
        </header>

        <!-- App grid -->
        <nav class="app-grid mt-7" aria-label="Applications">

          <!-- Har card ka link data-href / href mein badal dein -->
          <div class="cell" style="--i:0">
            <a class="card" href="#" data-href="https://forms.gle/9sSATviNW4R4im12A"
              style="--accent:#0b7a45;--accent-soft:#dcf0e4">
              <span class="icon-wrap"><i class="fa-solid fa-clipboard-list"></i></span>
              <span class="card-title">Sanitation Complaints</span>
            </a>
          </div>

          <div class="cell" style="--i:1">
            <a class="card" href="#" data-href="https://forms.gle/EyE5wFqT76mtH7Mc6"
              style="--accent:#c0392b;--accent-soft:#fbe3df">
              <span class="icon-wrap"><i class="fa-solid fa-ban"></i></span>
              <span class="card-title">Inactive Bills</span>
            </a>
          </div>

          <div class="cell" style="--i:2">
            <a class="card" href="#" data-href="https://forms.gle/HaUqYBePQNQDkUy8A"
              style="--accent:#b7791f;--accent-soft:#fbefd2">
              <span class="icon-wrap"><i class="fa-solid fa-money-bill-wave"></i></span>
              <span class="card-title">Waiver Bills</span>
            </a>
          </div>

          <div class="cell" style="--i:3">
            <a class="card" href="#" data-href="https://forms.gle/KtGYgSSqo9Y2ui7x8"
              style="--accent:#2563a8;--accent-soft:#dde9f8">
              <span class="icon-wrap"><i class="fa-solid fa-user-pen"></i></span>
              <span class="card-title">Data Correction</span>
            </a>
          </div>

        </nav>

        <p class="foot mt-10 text-center">&copy; <span id="year"></span> Department Portal</p>
      </main>
    </div>
  </div>

  <script>
    /* ---------- Yahan apna data set karein ---------- */
    const CONFIG = {
      department: 'Revenue Department'
    };

    document.getElementById('deptName').textContent = CONFIG.department;
    document.getElementById('year').textContent = new Date().getFullYear();

    /* ---------- Card interactions ---------- */
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    document.querySelectorAll('.card').forEach(card => {

      // 3D tilt (mouse only)
      if (!reduceMotion) {
        card.addEventListener('pointermove', e => {
          if (e.pointerType !== 'mouse') return;
          const r = card.getBoundingClientRect();
          const px = (e.clientX - r.left) / r.width - 0.5;
          const py = (e.clientY - r.top) / r.height - 0.5;
          card.style.setProperty('--ry', (px * 10).toFixed(2) + 'deg');
          card.style.setProperty('--rx', (-py * 10).toFixed(2) + 'deg');
        });
        card.addEventListener('pointerleave', () => {
          card.style.setProperty('--rx', '0deg');
          card.style.setProperty('--ry', '0deg');
        });
      }

      // Click: ripple + bounce, phir link open
      card.addEventListener('click', e => {
        // new tab / modified click ko normal chalne dein
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();

        const href = card.dataset.href || card.getAttribute('href');

        if (!reduceMotion) {
          const r = card.getBoundingClientRect();
          const size = Math.max(r.width, r.height) * 2;
          const x = (e.clientX || r.left + r.width / 2) - r.left - size / 2;
          const y = (e.clientY || r.top + r.height / 2) - r.top - size / 2;

          const rip = document.createElement('span');
          rip.className = 'ripple';
          rip.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
          card.appendChild(rip);
          rip.addEventListener('animationend', () => rip.remove());

          const icon = card.querySelector('.icon-wrap');
          icon.classList.remove('bounce');
          void icon.offsetWidth;            // animation restart
          icon.classList.add('bounce');
        }

        if (href && href !== '#') {
          setTimeout(() => { window.location.href = href; }, reduceMotion ? 0 : 420);
        }
      });
    });
  </script>
</body>

</html>
